name: Publish

# Публикация в npm по тегу релиза: v1.2.3 -> версия 1.2.3.
# Доступ к npm — секрет NPM_TOKEN, а если он не задан, то OIDC
# (Trusted Publishing), которому секрет не нужен вовсе.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify the release version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run compile

      - name: Publish (npm token)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public

      - name: Publish (Trusted Publishing)
        if: env.NODE_AUTH_TOKEN == ''
        run: npm publish --provenance --access public
