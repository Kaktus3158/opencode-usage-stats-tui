name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run compile

      - name: Check that dist matches the sources
        run: |
          if ! git diff --exit-code -- dist; then
            echo "dist/ is out of date — run 'npm run compile' and commit the result" >&2
            exit 1
          fi

      - name: Check package contents
        run: npm pack --dry-run
